[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sharingan"
version = "1.0.0"
description = "Sharingan: read a TV series with NLP & LLMs — scraping, zero-shot themes, NER character networks, jutsu classification and character chatbots."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "accelerate>=1.0",
    "datasets>=3.0",
    "evaluate>=0.4",
    "scikit-learn>=1.5",
    "peft>=0.13",
    "trl>=1.0",
    "sentence-transformers>=3.0",
    "spacy>=3.7",
    "scrapy>=2.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "networkx>=3.2",
    "pyvis>=0.3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pandas>=2.2",
    "pyarrow>=15",
    "nltk>=3.9",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "pyyaml>=6",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.43"]
dev = ["pytest>=8"]

[project.scripts]
sharingan = "sharingan.interface.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
